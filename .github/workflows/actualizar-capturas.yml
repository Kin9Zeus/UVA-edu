name: Actualizar capturas

# Regenera las capturas de referencia de e2e/retroceso-visual.spec.ts en
# Linux (el mismo sistema que las compara en CI) y las sube a la rama elegida.
# Se usa cuando un cambio visual es intencional: ver docs/qa/pruebas-visuales.md.
#
# Actions → "Actualizar capturas" → Run workflow → elegir la rama del PR.
# Un push hecho con GITHUB_TOKEN no dispara otro CI: después hay que volver a
# correr el CI del PR (Re-run jobs) o empujar cualquier commit.

on:
  workflow_dispatch:

concurrency:
  group: capturas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturas:
    name: Regenerar capturas de referencia
    # Nunca en master: las capturas se revisan en el diff del PR antes de fusionar.
    if: ${{ github.ref != 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: supabase-test
    permissions:
      contents: write
    env:
      CI: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MUX_SIGNING_KEY_ID: ${{ secrets.MUX_SIGNING_KEY_ID }}
      MUX_SIGNING_KEY_PRIVATE: ${{ secrets.MUX_SIGNING_KEY_PRIVATE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Regenerar capturas
        run: npx playwright test e2e/retroceso-visual.spec.ts --update-snapshots

      - name: Subir las capturas a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/retroceso-visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Las capturas no cambiaron."
          else
            git commit -m "Pruebas: capturas de referencia actualizadas"
            git push
          fi
