# Actualizaciones de VERSIÓN (las de seguridad son otra cosa, abajo).
#
# Configuración conservadora a propósito (AUDIT-2026-08-24.md, P2-4): minor
# y patch agrupados en un solo PR semanal, para no saturar al equipo, y las
# versiones mayores ignoradas, porque suelen traer cambios de comportamiento
# (Next.js, Prisma, React) que merecen su propia revisión, no un PR
# automático de fondo.
#
# Actualizaciones de SEGURIDAD (plan de blindaje, fases 3-6)
# ----------------------------------------------------------
# No se encienden desde este archivo: es un ajuste del repo (Settings → Code
# security → Dependabot security updates) que activa un administrador.
# Encendidas, llegan aunque impliquen una versión mayor: el `ignore` de abajo
# está acotado a `version-update:semver-major`, y GitHub no aplica
# `update-types` a las de seguridad. Tampoco esperan el `cooldown`.
#
# Espera antes de una versión nueva (`cooldown`, fase 6)
# ------------------------------------------------------
# Los paquetes comprometidos de npm suelen detectarse y retirarse en los
# primeros días. Dependabot no propone una versión publicada hace menos de
# 5 días. El CI instala con `npm ci`, que respeta exactamente el lockfile.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      dependencias-menores:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Acciones de GitHub (fase 9.2). El CI las fija por SHA exacto: Dependabot
  # entiende ese formato, propone el SHA nuevo y actualiza el comentario con
  # la versión. Misma política que npm: menores agrupadas, mayores a mano.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    groups:
      acciones-menores:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Imagen base del Dockerfile (fase 11.1), fijada por digest.
  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Imagen de Vector (fase 10.1), fijada por digest.
  - package-ecosystem: "docker"
    directory: "/infra/vector"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 5
