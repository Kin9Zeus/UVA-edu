<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U.V.A. — Plataforma de formación para el gremio de la construcción</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app"></div>

<template id="app-template">
<sc-if value="{{ notAuthed }}" hint-placeholder-val="{{ true }}">
<div style="display:grid;grid-template-columns:1fr 1fr;min-height:100vh;width:100%">
  <div style="position:relative;padding:44px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden">
    <div style="display:flex;align-items:center;gap:11px">
      
      <div onClick="{{ goLanding }}" style="font:700 24px var(--font-heading);letter-spacing:.1em;white-space:nowrap;cursor:pointer;display:{{ labelDisplay }}">U.V.A<span style="color:var(--color-accent)">.</span></div>
      
    </div>
    <div style="max-width:440px;position:relative;z-index:2">
      <h1 style="font-size:46px;margin-bottom:14px">Aprende el oficio.<br>Presupuesta de verdad.</h1>
      <p style="font-size:16px;max-width:400px;color:color-mix(in srgb,var(--color-text) 68%,transparent)">Formación para arquitectos, residentes de obra y presupuestadores. Rutas, plantillas de APU y planos que puedes usar mañana en la obra.</p>
      <div style="display:flex;gap:26px;margin-top:30px">
        <div><div style="font-family:var(--font-heading);font-size:26px;color:var(--color-accent)">180+</div><div style="font-size:12px;opacity:.6">cursos del gremio</div></div>
        <div><div style="font-family:var(--font-heading);font-size:26px;color:var(--color-accent)">340</div><div style="font-size:12px;opacity:.6">plantillas y planos</div></div>
        <div><div style="font-family:var(--font-heading);font-size:26px;color:var(--color-accent)">12</div><div style="font-size:12px;opacity:.6">rutas curadas</div></div>
      </div>
    </div>
    <div style="position:absolute;right:-140px;bottom:-120px;width:420px;height:420px;border-radius:999px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,#FF007A 26%,transparent),transparent 70%)"></div>
    <div style="position:absolute;right:52px;top:96px;width:188px;height:188px;border-radius:999px;overflow:hidden;opacity:.6;z-index:1" class="washed"></div>
    <div style="font-size:12px;opacity:.45;position:relative;z-index:2">Arquitectura · Construcción · Presupuestos</div>
  </div>

  <div style="display:grid;place-items:center;padding:44px;background:color-mix(in srgb,#FAFAFA 4%,transparent)">
    <div style="width:396px">
      <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
      <div>
        <span style="display:var(--note-d);font:600 9px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,#F2C012 20%,transparent);color:#FFDD55;margin-bottom:14px">M1 · RF-M1.1</span>
        <h2 style="font-size:30px;margin-bottom:6px">Inicia sesión</h2>
        <p style="font-size:14px;opacity:.6;margin-bottom:24px">Retoma tu ruta donde la dejaste.</p>
        <button class="btn btn-secondary btn-block" onClick="{{ googleLogin }}" style="gap:10px;min-height:44px;margin-top:0">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5v17M3.5 12h17"></path></svg>
          Continuar con Google
        </button>
        <div style="display:flex;align-items:center;gap:12px;margin:20px 0">
          <div style="height:1px;flex:1;background:var(--color-divider)"></div>
          <span style="font-size:11px;opacity:.45">o con tu correo</span>
          <div style="height:1px;flex:1;background:var(--color-divider)"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="field"><label>Correo</label><input class="input" type="email" placeholder="tu@correo.com" value="{{ email }}" onChange="{{ setEmail }}"></div>
          <div class="field"><label>Contraseña</label><input class="input" type="password" placeholder="••••••••" value="{{ pass }}" onChange="{{ setPass }}"></div>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:10px"><a href="#" style="font-size:12px">¿Olvidaste tu contraseña?</a></div>
        <button class="btn btn-primary btn-block" onClick="{{ doLogin }}" style="min-height:46px;margin-top:16px;font-size:15px">Entrar</button>
        <p style="font-size:13px;opacity:.6;text-align:center;margin-top:20px">¿No tienes cuenta? <a href="#" onClick="{{ goRegistro }}">Créala gratis</a></p>
      </div>
      </sc-if>

      <sc-if value="{{ isRegistro }}" hint-placeholder-val="{{ false }}">
      <div>
        <span style="display:var(--note-d);font:600 9px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,#F2C012 20%,transparent);color:#FFDD55;margin-bottom:14px">M1 · RF-M1.1 / RF-M1.4</span>
        <h2 style="font-size:30px;margin-bottom:6px">Crea tu cuenta</h2>
        <p style="font-size:14px;opacity:.6;margin-bottom:20px">Paso {{ regStep }} de 2 · {{ regStepLabel }}</p>
        <div style="display:flex;gap:6px;margin-bottom:24px">
          <div style="height:4px;flex:1;border-radius:999px;background:var(--color-accent)"></div>
          <div style="height:4px;flex:1;border-radius:999px;background:{{ step2Bar }}"></div>
        </div>

        <sc-if value="{{ isRegStep1 }}" hint-placeholder-val="{{ false }}">
        <div>
          <button class="btn btn-secondary btn-block" onClick="{{ googleLogin }}" style="gap:10px;min-height:44px;margin-top:0">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5v17M3.5 12h17"></path></svg>
            Registrarme con Google
          </button>
          <div style="display:flex;align-items:center;gap:12px;margin:20px 0">
            <div style="height:1px;flex:1;background:var(--color-divider)"></div>
            <span style="font-size:11px;opacity:.45">o con correo y contraseña</span>
            <div style="height:1px;flex:1;background:var(--color-divider)"></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:14px">
            <div class="field"><label>Correo</label><input class="input" type="email" placeholder="tu@correo.com" value="{{ email }}" onChange="{{ setEmail }}"></div>
            <div class="field"><label>Contraseña</label><input class="input" type="password" placeholder="Mínimo 8 caracteres" value="{{ pass }}" onChange="{{ setPass }}"></div>
            <div class="field"><label>Repite la contraseña</label><input class="input" type="password" placeholder="Debe coincidir" value="{{ pass2 }}" onChange="{{ setPass2 }}" style="border-color:{{ pass2Border }}"></div>
          </div>
          <button class="btn btn-primary btn-block" onClick="{{ submitReg }}" style="min-height:46px;margin-top:18px;font-size:15px">Continuar</button>
        </div>
        </sc-if>

        <sc-if value="{{ isRegStep2 }}" hint-placeholder-val="{{ false }}">
        <div>
          <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:color-mix(in srgb,#F2C012 16%,transparent);font-size:13px;margin-bottom:20px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFDD55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5.5 5.5L20 7"></path></svg>
            <span style="color:#FFDD55">Contraseña verificada</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:14px">
            <div class="field"><label>¿Cómo te llamas?</label><input class="input" type="text" placeholder="Nombre y apellido" value="{{ name }}" onChange="{{ setName }}"></div>
            <div class="field"><label>Tu rol en el gremio (opcional)</label><input class="input" type="text" placeholder="Arquitecto, residente, presupuestador…" value="{{ role }}" onChange="{{ setRole }}"></div>
          </div>
          <button class="btn btn-primary btn-block" onClick="{{ submitName }}" style="min-height:46px;margin-top:18px;font-size:15px">Crear mi cuenta</button>
          <button class="btn btn-ghost btn-block" onClick="{{ backReg }}" style="margin-top:6px">Volver</button>
        </div>
        </sc-if>

        <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:14px;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,#FF007A 16%,transparent);font-size:13px;color:#FF7AB8">{{ error }}</div>
        </sc-if>
        <p style="font-size:13px;opacity:.6;text-align:center;margin-top:20px">¿Ya tienes cuenta? <a href="#" onClick="{{ goLogin }}">Inicia sesión</a></p>
      </div>
      </sc-if>
    </div>
  </div>
</div>
</sc-if>

<sc-if value="{{ isLanding }}" hint-placeholder-val="{{ true }}">
<div style="width:100%">
  <header style="position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:20px;padding:20px clamp(24px,4vw,56px);backdrop-filter:blur(14px);background:color-mix(in srgb,#09090B 82%,transparent);border-bottom:1px solid var(--color-divider)" data-comment-anchor="fa87390162-header">
    <div onClick="{{ goLanding }}" style="display:flex;align-items:center;gap:9px;cursor:pointer">
      
      <div onClick="{{ goLanding }}" style="font:700 24px var(--font-heading);letter-spacing:.1em;white-space:nowrap;cursor:pointer;display:{{ labelDisplay }}">U.V.A<span style="color:var(--color-accent)">.</span></div>
    </div>
    <div style="position:relative;flex:1;max-width:400px">
      <svg width="17" height="17" style="position:absolute;left:16px;top:14px;color:#A1A1AA" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m20 20-4.6-4.6"></path></svg>
      <input class="input" placeholder="¿Qué quieres aprender?" style="padding-left:44px;min-height:46px;font-size:14.5px">
    </div>
    <nav style="display:flex;align-items:center;gap:22px;margin-left:auto;flex-wrap:wrap">
      <a href="#" onClick="{{ openAuth }}" style="font-size:15px;font-weight:500;text-decoration:none;color:var(--color-text)">Cursos</a>
      <a href="#" onClick="{{ openAuth }}" style="font-size:15px;font-weight:500;text-decoration:none;color:var(--color-text)">Precios</a>
      <button class="btn btn-primary" onClick="{{ openAuth }}" style="font-size:14.5px;padding:11px 22px;border-radius:10px">Acceder</button>
    </nav>
  </header>

  <section style="position:relative;overflow:hidden;padding:clamp(56px,9vw,110px) clamp(20px,4vw,56px) 78px;text-align:center" data-comment-anchor="30595395c0-section">
    <div style="position:absolute;left:50%;top:-180px;transform:translateX(-50%);width:900px;height:520px;border-radius:999px;background:radial-gradient(closest-side,color-mix(in srgb,#FF007A 20%,transparent),transparent);pointer-events:none"></div>
    <div style="position:relative;max-width:820px;margin:0 auto">
      <h1 style="font-size:clamp(44px,6vw,72px);line-height:1.04;margin:0 0 6px">La escuela del oficio</h1>
      <h1 style="font-size:clamp(44px,6vw,72px);line-height:1.04;margin:0 0 26px;color:var(--color-accent)">de la construcción</h1>
      <p style="font-size:18px;color:#A1A1AA;max-width:560px;margin:0 auto 34px">Arquitectura, obra y presupuestos enseñados por gente que construye. 180+ cursos, 340 plantillas y planos listos para usar.</p>
      <div style="display:flex;justify-content:center">
        <button onClick="{{ openAuth }}" style="border: 0; cursor: pointer; padding: 17px 46px; border-radius: 999px; font: 700 16.5px var(--font-body); color: #09090B; box-shadow: 0 10px 30px rgba(255,0,122,.28); background-color: #FF007A" style-hover="filter:brightness(1.08)">COMENZAR YA</button>
      </div>
      
      <div style="display:flex;justify-content:center;gap:44px;margin-top:44px;flex-wrap:wrap">
        <div><div style="font-family:var(--font-mono);font-size:26px;font-weight:700">12.400</div><div style="font-size:12px;color:#A1A1AA">alumnos del gremio</div></div>
        <div><div style="font-family:var(--font-mono);font-size:26px;font-weight:700">180+</div><div style="font-size:12px;color:#A1A1AA">cursos técnicos</div></div>
        <div><div style="font-family:var(--font-mono);font-size:26px;font-weight:700">10</div><div style="font-size:12px;color:#A1A1AA">escuelas</div></div>
      </div>
    </div>
  </section>

  <section style="padding:64px clamp(20px,4vw,56px);background:#0D0D10;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)">
    <div style="max-width:1180px;margin:0 auto">
      <div style="text-align:center;margin-bottom:44px">
        <h2 style="font-size:clamp(22px,2.6vw,30px);margin:0 0 14px">Lo que tu equipo se lleva de <span style="color:#F2C012">U.V.A.</span></h2>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px;align-items:center">
        <div>
          <h3 style="font-size:clamp(22px,2.4vw,28px);margin:0 0 22px;line-height:1.2"><span style="color:var(--color-accent)">Formación real de obra</span>, no teoría de salón</h3>
          <div style="display:flex;flex-direction:column;gap:14px">
            <div style="display:flex;gap:12px;align-items:flex-start"><span style="color:var(--color-accent)">▸</span><div><div style="font-size:14px;font-weight:600">Clases cortas para aplicar el mismo día</div><div style="font-size:12.5px;color:#A1A1AA">Cada lección cierra con un entregable.</div></div></div>
            <div style="display:flex;gap:12px;align-items:flex-start"><span style="color:#3F3F46">▸</span><div><div style="font-size:14px;font-weight:600">Rutas por cargo</div><div style="font-size:12.5px;color:#A1A1AA">Residente, presupuestador, coordinador BIM.</div></div></div>
            <div style="display:flex;gap:12px;align-items:flex-start"><span style="color:#3F3F46">▸</span><div><div style="font-size:14px;font-weight:600">Plantillas y planos descargables</div><div style="font-size:12.5px;color:#A1A1AA">APU, cantidades, cronogramas, checklists.</div></div></div>
            
            <div style="display:flex;gap:12px;align-items:flex-start"><span style="color:#3F3F46">▸</span><div><div style="font-size:14px;font-weight:600">Reportes de avance por colaborador</div><div style="font-size:12.5px;color:#A1A1AA">Para el área de formación de la empresa.</div></div></div>
          </div>
        </div>
        <div style="border-radius:10px;overflow:hidden;height:340px;border:1px solid var(--color-divider)"><image-slot id="uva-landing-app" shape="rounded" radius="0" placeholder="Captura de la plataforma"></image-slot></div>
      </div>
    </div>
  </section>

  

  <section style="padding:96px clamp(20px,4vw,56px);text-align:center">
    <div style="max-width:900px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:30px">
      <h2 style="font-size:clamp(30px,4.4vw,52px);line-height:1.1;margin:0"><span style="background:linear-gradient(96deg,#FF007A 0%,#FF6A3D 48%,#F2C012 100%);-webkit-background-clip:text;background-clip:text;color:transparent">Más de 400 empresas</span> usan U.V.A. para la formación de sus equipos</h2>
      <p style="font-size:15px;color:#A1A1AA;margin:0;max-width:520px">Constructoras, estudios de arquitectura e interventorías que forman a su equipo con rutas por cargo.</p>
      <button onClick="{{ openAuth }}" style="border: 0; cursor: pointer; padding: 17px 46px; border-radius: 999px; font: 700 16.5px var(--font-body); color: #09090B; box-shadow: 0 10px 30px rgba(255,0,122,.28); background-color: #FF007A" style-hover="filter:brightness(1.08)">Iniciar sesión</button>
    </div>
  </section>

  <section style="padding:64px clamp(20px,4vw,56px);max-width:1180px;margin:0 auto">
    <div style="text-align:center;margin-bottom:32px">
      <h2 style="font-size:clamp(22px,2.6vw,30px);margin:0 0 8px">Un plan, todo el gremio</h2>
      <p style="font-size:14px;color:#A1A1AA;margin:0">Catálogo completo, plantillas descargables y certificados. Precios en pesos colombianos, IVA incluido.</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:18px;align-items:stretch;max-width:1000px;margin:0 auto">
      <div class="card" style="padding:26px;gap:16px;border-radius:10px">
        <div style="display:flex;align-items:flex-start;gap:8px">
          <div><div style="font-family:var(--font-heading);font-size:20px">Basic</div><div style="font-size:12px;color:#A1A1AA;margin-top:2px">Mensual · 1 estudiante</div></div>
          
        </div>
        <div>
          <span style="font-family:var(--font-mono);font-size:28px;font-weight:700">$59.900</span><span style="font-size:13px;color:#A1A1AA"> /mes</span>
          <div style="font-size:12px;color:#A1A1AA;margin-top:4px">Se cobra cada mes</div>
        </div>
        <button onClick="{{ openAuth }}" class="btn btn-block btn-secondary" style="margin-top:0;border-radius:10px">Suscribirme</button>
        <div style="display:flex;flex-direction:column;gap:9px;padding-top:4px">
          <div style="display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:#FAFAFA"><svg width="15" height="15" style="flex:none;color:#F2C012" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5.5 5.5L20 7"></path></svg><span>Catálogo completo de cursos</span></div>
          <div style="display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:#FAFAFA"><svg width="15" height="15" style="flex:none;color:#F2C012" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5.5 5.5L20 7"></path></svg><span>Certificados digitales</span></div>
          <div style="display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:#52525B"><svg width="15" height="15" style="flex:none;color:#52525B" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg><span>Plantillas, planos y APU descargables</span></div>
          <div style="display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:#52525B"><svg width="15" height="15" style="flex:none;color:#52525B" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg><span>Certificado físico de rutas</span></div>
          <div style="display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:#52525B"><svg width="15" height="15" style="flex:none;color:#52525B" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg><span>Eventos y webinars en vivo</span></div>
        </div>
      </div>
      <div class="card" style="padding:26px;gap:16px;border-radius:10px;border-color:color-mix(in srgb,var(--color-accent) 55%,transparent);background:color-mix(in srgb,var(--color-accent) 10%,transparent)">
        <div style="display:flex;align-items:flex-start;gap:8px">
          <div><div style="font-family:var(--font-heading);font-size:20px">Expert</div><div style="font-size:12px;color:#A1A1AA;margin-top:2px">Anual · 1 estudiante</div></div>
          <span style="margin-left:auto;padding:5px 10px;border-radius:6px;font:600 10px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;background:color-mix(in srgb,#F2C012 16%,transparent);border:1px solid color-mix(in srgb,#F2C012 40%,transparent);color:#FFDD55;white-space:nowrap">Ahorras 5 meses</span>
        </div>
        <div>
          <span style="font-family:var(--font-mono);font-size:28px;font-weight:700">$449.900</span><span style="font-size:13px;color:#A1A1AA"> /año</span>
          <div style="font-size:12px;color:#A1A1AA;margin-top:4px">o 4 cuotas de $112.475 sin interés</div>
        </div>
        <button onClick="{{ openAuth }}" class="btn btn-block btn-primary" style="margin-top:0;border-radius:10px">Suscribirme</button>
        <div style="display:flex;flex-direction:column;gap:9px;padding-top:4px">
          <div style="display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:#FAFAFA"><svg width="15" height="15" style="flex:none;color:#F2C012" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5.5 5.5L20 7"></path></svg><span>Catálogo completo y rutas curadas</span></div>
          <div style="display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:#FAFAFA"><svg width="15" height="15" style="flex:none;color:#F2C012" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5.5 5.5L20 7"></path></svg><span>Certificados digitales</span></div>

              <div class="field"><label>Usuario público</label><input class="input" value="{{ profileHandle }}" onChange="{{ setPHandle }}"></div>
