<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>No encontramos esta página — U.V.A.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/error.css">
</head>
<body>
<main class="error-shell error-shell--standalone">
  <div class="error-block">
    <div class="error-code-row">
      <span class="error-code">404</span>
      <span class="error-dot" aria-hidden="true"></span>
    </div>
    <div class="error-copy">
      <h1 class="error-title">No encontramos esta página</h1>
      <p class="error-text">El curso, la lección o el enlace que buscas no existe o cambió de lugar. Revisa el catálogo para encontrarlo de nuevo.</p>
    </div>
    <div class="error-actions">
      <a class="btn-primary" href="/catalogo">Volver al catálogo</a>
      <a class="link-secondary" href="/">Ir al inicio</a>
    </div>
    <div class="error-meta">HTTP 404 · /catalogo</div>
  </div>
</main>
</body>
</html>
