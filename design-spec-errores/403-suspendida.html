<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu cuenta fue suspendida — U.V.A.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/error.css">
</head>
<body>
<main class="error-shell error-shell--standalone">
  <div class="error-block">
    <div class="badge-warning">
      <span class="dot" aria-hidden="true"></span>
      <span class="txt">Cuenta suspendida</span>
    </div>
    <div class="error-code-row">
      <span class="error-code">403</span>
    </div>
    <div class="error-copy">
      <h1 class="error-title">Tu cuenta fue suspendida</h1>
      <p class="error-text">Mientras esté suspendida no puedes entrar a tus cursos ni a tus certificados. Escríbenos a soporte@uva.co y lo revisamos contigo.</p>
    </div>
    <div class="error-actions">
      <a class="btn-primary" href="mailto:soporte@uva.co">Contactar soporte</a>
      <a class="link-secondary" href="/">Ir al inicio</a>
    </div>
    <div class="error-meta">HTTP 403 · estado: SUSPENDIDA</div>
  </div>
</main>
</body>
</html>
